name: PRIME-RL Demonstrator Validation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demonstrator-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run demonstrator checks
        run: node run_demonstrator_tests.cjs
